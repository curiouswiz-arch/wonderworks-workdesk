<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#535c43"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>WONDERWORKS 모델 스튜디오</title><style>body{margin:0;background:#f6f4f0;color:#292925;font:16px/1.6 system-ui}main{max-width:520px;margin:10vh auto;padding:28px}h1{font-size:28px;font-weight:500}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;margin:10px 0;border:1px solid #ccc;border-radius:8px}button{background:#535c43;color:white}small{color:#666}#status{color:#8c3128}</style><main><small>WONDERWORKS · STUDIO</small><h1>모델 합성 요청</h1><p>개인 작업 공간을 연결해 모델과 스타일 레퍼런스를 모아보세요.</p><label for="workspace">Google 작업 공간 주소</label><input id="workspace" type="url" placeholder="https://script.google.com/macros/s/…/exec"><button id="open">로그인하여 작업 공간 열기</button><p id="status" role="status"></p><small>모델 사진과 요청 자료는 로그인한 비공개 작업 공간에 저장됩니다. 브라우저 메뉴에서 홈 화면에 추가할 수 있어요.</small></main><script>const input=document.getElementById('workspace');input.value=localStorage.getItem('model-workspace')||'';document.getElementById('open').onclick=()=>{try{const url=new URL(input.value.trim());if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)||url.search||url.hash)throw Error();localStorage.setItem('model-workspace',url.href);location.assign(url.href)}catch{document.getElementById('status').textContent='Google Apps Script 작업 공간 주소를 확인해주세요.'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
